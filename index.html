<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Council</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Spectral+SC:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0911;
    --panel: #14101f;
    --plum: #241934;
    --brass: #b9924f;
    --brass-dim: #6f5a37;
    --ink: #d9d2e2;
    --ink-dim: #8b83a0;
    --ember: #7a3c3c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(ellipse 900px 600px at 50% 8%, #1d1530 0%, transparent 60%),
      var(--void);
    color: var(--ink);
    font-family: "Spectral", Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 6vh 24px 8vh;
    overflow-x: hidden;
  }

  .eyebrow {
    font-family: "Spectral SC", "Spectral", serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--brass-dim);
    margin: 0 0 6px;
  }

  h1 {
    font-weight: 600;
    font-size: clamp(28px, 4.5vw, 40px);
    margin: 0 0 4px;
    color: var(--ink);
  }

  .sub {
    color: var(--ink-dim);
    font-style: italic;
    font-size: 15px;
    margin: 0 0 48px;
    text-align: center;
    max-width: 46ch;
  }

  /* --- the orb --- */

  .orb-wrap {
    position: relative;
    width: min(46vw, 300px);
    height: min(46vw, 300px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    opacity: 0.55;
    transition: opacity 0.4s ease;
  }

  .ring.spin {
    animation: spin 1.1s linear infinite;
    border-color: var(--brass);
    opacity: 1;
    box-shadow: 0 0 40px 4px rgba(185, 146, 79, 0.25);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .orb-button {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background: var(--panel);
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(185, 146, 79, 0.35),
      0 20px 60px rgba(0,0,0,0.55),
      inset 0 0 40px rgba(0,0,0,0.6);
    transition: transform 0.5s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.5s ease;
  }

  .orb-button:hover {
    transform: scale(1.02);
  }

  .orb-button:active {
    transform: scale(0.98);
  }

  .orb-button.thinking {
    animation: pulse 0.7s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(185,146,79,0.35), 0 20px 60px rgba(0,0,0,0.55), inset 0 0 40px rgba(0,0,0,0.6), 0 0 0px rgba(185,146,79,0); }
    50% { box-shadow: 0 0 0 1px rgba(185,146,79,0.6), 0 20px 70px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.6), 0 0 50px rgba(185,146,79,0.35); }
  }

  .orb-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.9) contrast(1.05);
  }

  .orb-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
    font-style: italic;
    min-height: 18px;
  }

  /* --- the verdict plaque --- */

  .plaque {
    margin-top: 40px;
    max-width: 52ch;
    min-height: 84px;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.55s ease, transform 0.55s ease;
    padding: 0 12px;
  }

  .plaque.show {
    opacity: 1;
    transform: translateY(0);
  }

  .plaque .rule {
    width: 40px;
    height: 1px;
    background: var(--brass-dim);
    margin: 0 auto 18px;
  }

  .plaque p {
    font-size: clamp(20px, 3.2vw, 26px);
    line-height: 1.5;
    margin: 0;
    color: #efe9f5;
    font-weight: 400;
  }

  /* --- setup notice --- */

  .setup-notice {
    max-width: 60ch;
    background: var(--plum);
    border: 1px solid var(--brass-dim);
    border-radius: 4px;
    padding: 18px 22px;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    margin-top: 36px;
  }

  .setup-notice code {
    background: rgba(0,0,0,0.35);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring.spin { animation: none; }
    .orb-button.thinking { animation: none; }
    .plaque { transition: opacity 0.2s linear; }
  }
</style>
</head>
<body>

  <p class="eyebrow">an audience with</p>
  <h1>The Council</h1>
  <p class="sub">Ask your question aloud. Then click the orb to receive judgment.</p>

  <div class="orb-wrap">
    <div class="ring" id="ring"></div>
    <button class="orb-button" id="orbButton" aria-label="Consult the council">
      <img id="orbImage" src="council.png" alt=""
           onerror="this.replaceWith(orbFallback())">
    </button>
  </div>

  <p class="hint" id="hint">click to consult</p>

  <div class="plaque" id="plaque">
    <div class="rule"></div>
    <p id="verdictText"></p>
  </div>

  <div class="setup-notice" id="setupNotice" style="display:none;"></div>

  <audio id="verdictAudio" preload="none"></audio>

  <script>
    // ---- config ----
    // Put an image named "council.png" next to this file to use it as the
    // orb. To use a different filename, change the img src attribute above,
    // or edit ORB_IMAGE_NAME below (used only for the setup message).
    const ORB_IMAGE_NAME = "council.png";
    const MANIFEST_PATH = "voicelines/manifest.json";

    const orbButton = document.getElementById("orbButton");
    const ring = document.getElementById("ring");
    const hint = document.getElementById("hint");
    const plaque = document.getElementById("plaque");
    const verdictText = document.getElementById("verdictText");
    const verdictAudio = document.getElementById("verdictAudio");
    const setupNotice = document.getElementById("setupNotice");

    function orbFallback() {
      const div = document.createElement("div");
      div.className = "orb-fallback";
      div.textContent = "place an image named \"" + ORB_IMAGE_NAME + "\" in this folder";
      return div;
    }

    let lines = [];
    let ready = false;
    let lastIndex = -1;

    function showSetupNotice(message) {
      setupNotice.style.display = "block";
      setupNotice.innerHTML = message;
    }

    async function loadManifest() {
      try {
        const res = await fetch(MANIFEST_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error("empty manifest");
        lines = data;
        ready = true;
        hint.textContent = "click to consult";
      } catch (err) {
        hint.textContent = "the council is silent";
        showSetupNotice(
          "Couldn't load <code>voicelines/manifest.json</code>.<br><br>" +
          "1. Run <code>generate_voicelines.py</code> to create the voicelines folder and manifest.<br>" +
          "2. Serve this folder over a local server (opening the file directly won't work due to browser " +
          "security rules) &mdash; for example:<br><code>python -m http.server</code><br>" +
          "then open <code>http://localhost:8000</code>.<br><br>" +
          "(" + err.message + ")"
        );
      }
    }

    function pickLine() {
      if (lines.length === 1) return lines[0];
      let idx;
      do {
        idx = Math.floor(Math.random() * lines.length);
      } while (idx === lastIndex);
      lastIndex = idx;
      return lines[idx];
    }

    async function consult() {
      if (!ready || orbButton.classList.contains("thinking")) return;

      plaque.classList.remove("show");
      orbButton.classList.add("thinking");
      ring.classList.add("spin");
      hint.textContent = "the council deliberates...";

      const entry = pickLine();

      // let the "thinking" animation play briefly before revealing
      await new Promise(r => setTimeout(r, 750));

      orbButton.classList.remove("thinking");
      ring.classList.remove("spin");
      hint.textContent = "click to consult again";

      verdictText.textContent = entry.text;
      plaque.classList.add("show");

      verdictAudio.src = "voicelines/" + entry.file;
      verdictAudio.play().catch(() => {
        // autoplay might be blocked until a user gesture exists;
        // this call is itself inside a click handler so it should be fine,
        // but fail silently if a browser still refuses.
      });
    }

    orbButton.addEventListener("click", consult);

    loadManifest();
  </script>

</body>
</html>
